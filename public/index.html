    <meta property="og:site_name" content="Víctor Manuel Gómez Álvarez" />
    <meta property="og:title" content="Víctor Manuel Gómez Álvarez · Desarrollador Full Stack" />
    <meta
      property="og:description"
      content="Portfolio de Víctor Manuel Gómez Álvarez, desarrollador Full Stack con base en .NET y React en Madrid. Proyectos, experiencia y stack."
    />
    <meta property="og:url" content="https://vga-dev.es/es/" />

    <noscript><meta http-equiv="refresh" content="0; url=/es/" /></noscript>
    <script>
      // Static host: no server-side redirect, so pick the language here.
      var languages = navigator.languages || [navigator.language || 'es'];
      var target = /^en\b/i.test(languages[0] || '') ? '/en/' : '/es/';
      location.replace(target);
    </script>

  <body>
